[build]
  publish = "."
  command = "echo 'Static HTML site'"

# Form configuration
[[forms]]
  name = "contact"
  method = "POST"
  
[[forms]]
  name = "service-inquiry"
  method = "POST"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Spam filtering rules (optional)
[[headers]]
  for = "/"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
